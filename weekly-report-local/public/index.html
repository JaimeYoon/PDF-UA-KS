<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주간 업무 보고 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-inner">
        <div>
          <h1>📋 주간 업무 보고</h1>
          <span class="subtitle">사업개발팀 · Confluence 자동 동기화</span>
        </div>
        <div class="header-actions">
          <span class="sync-time" id="sync-time"></span>
          <button class="btn btn-primary" id="sync-btn">🔄 지금 동기화</button>
        </div>
      </div>
    </header>

    <!-- 로딩 -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>데이터 불러오는 중...</p>
    </div>

    <!-- 빈 상태 -->
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">📂</div>
      <h2>아직 동기화된 데이터가 없습니다</h2>
      <p>터미널에서 아래 명령어를 실행하세요:</p>
      <code>node sync.js</code>
      <br><br>
      <button class="btn btn-primary" id="sync-btn-empty">🔄 지금 동기화</button>
    </div>

    <!-- 메인 콘텐츠 -->
    <main class="main" id="main" style="display:none">

      <!-- 탭 -->
      <div class="tabs">
        <button class="tab active" data-tab="overview">이번 주 현황</button>
        <button class="tab" data-tab="diff">지난주 대비 변화</button>
        <button class="tab" data-tab="history">보고 이력</button>
      </div>

      <!-- ═══ 탭: 이번 주 현황 ═══ -->
      <div class="tab-panel active" id="tab-overview">

        <!-- 보고서 제목 & 링크 -->
        <div class="report-title-bar">
          <div>
            <h2 id="report-title">-</h2>
            <span class="report-meta" id="report-meta"></span>
          </div>
          <a class="confluence-link" id="confluence-link" href="#" target="_blank" rel="noopener">
            Confluence에서 보기 →
          </a>
        </div>

        <!-- 전체 진척도 -->
        <div class="progress-hero">
          <div class="circle-wrap">
            <svg class="circle-svg" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="50" fill="none" stroke="#e5e7eb" stroke-width="12"/>
              <circle id="circle-bar" cx="60" cy="60" r="50" fill="none" stroke="#4f46e5"
                stroke-width="12" stroke-linecap="round"
                stroke-dasharray="314" stroke-dashoffset="314"
                transform="rotate(-90 60 60)"/>
            </svg>
            <span class="circle-label" id="overall-pct">-</span>
          </div>
          <div class="progress-info">
            <div class="progress-info-title">전체 진척도</div>
            <p class="report-summary" id="report-summary"></p>
          </div>
        </div>

        <!-- 카테고리별 현황 -->
        <div class="section-title">카테고리별 현황</div>
        <div class="categories" id="categories"></div>

        <!-- 하이라이트 & 이슈 -->
        <div class="two-col">
          <div class="card">
            <h3>✅ 주요 성과</h3>
            <ul id="highlights"></ul>
          </div>
          <div class="card">
            <h3>⚠️ 이슈 / 리스크</h3>
            <ul id="issues"></ul>
          </div>
        </div>

        <!-- 다음 계획 -->
        <div class="card mt">
          <h3>📅 다음 주 계획</h3>
          <ul id="next-plans"></ul>
        </div>
      </div>

      <!-- ═══ 탭: 지난주 대비 변화 ═══ -->
      <div class="tab-panel" id="tab-diff" style="display:none">
        <div id="diff-content"></div>
      </div>

      <!-- ═══ 탭: 보고 이력 ═══ -->
      <div class="tab-panel" id="tab-history" style="display:none">
        <div class="section-title">진척도 추이</div>
        <div class="chart-card">
          <canvas id="history-chart"></canvas>
        </div>
        <div class="section-title mt">전체 보고 목록</div>
        <div class="history-list" id="history-list"></div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
